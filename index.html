<!DOCTYPE html>
<html>
<head>
    <title>Morpynet</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: black;
        }

        body {
            /* 1. Only loads the image ONCE in code */
            background-image: url("background_for_not_bald_peopleomggggsatidk.png");
            background-position: top center;
            background-repeat: repeat-y; /* Tells it to tile downwards */
            
            /* 2. Forces the background to perfectly match the width of the screen */
            background-size: 100% auto; 

            /* 3. THE ELEGANT MAGIC: Sets the page height to exactly 4 aspect-ratio images tall */
            aspect-ratio: 100 / calc(4 * 148); 
            
            /* (Note: 148 is the approximate height-to-width ratio of your tall image. 
               Multiplying it by 4 tells the browser to make the page exactly 4 images tall!) */
        }

        /* Centered text container */
        .text-container {
            position: absolute;
            top: 15%; 
            width: 100%;
            text-align: center;
            color: black; 
            font-family: Arial, sans-serif;
        }

        h1 { margin: 0 0 10px; font-size: 3rem; }
        p { margin: 0; font-style: italic; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div class="text-container">
        <h1>.</h1>
        <p>do not be afraid</p>
    </div>

</body>
</html>
